services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_augmented}
      POSTGRES_USER: ${POSTGRES_USER:-property_augmented}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-property_augmented}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    ports: ["8080:8080"]
    volumes:
      - uploads:/data/storage
  web:
    build: ./web
    environment:
      PDA_API_ORIGIN: http://api:8080
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
  uploads:
