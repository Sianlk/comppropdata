name: Property Augmented CI
on:
  push:
    branches: [property-augmented-platform]
    paths: ['property-augmented/**']
  pull_request:
    paths: ['property-augmented/**']
jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: property-augmented/api}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: property-augmented/web}}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
