name: Property Augmented CI
on:
  push:
    branches: [property-augmented-platform]
    paths: ['property-augmented/**', '.github/workflows/property-augmented-ci.yml']
  pull_request:
    paths: ['property-augmented/**', '.github/workflows/property-augmented-ci.yml']
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-augmented/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile app/main.py app/full_stack.py app/bootstrap.py app/extensions.py app/production.py
      - run: python -c "from app.production import app; paths={r.path for r in app.routes}; required={'/health','/api/v1/system/status','/api/v1/auth/login','/api/v1/auth/forgot-password','/api/v1/projects','/api/v1/site/intelligence/full','/api/v1/seo/strategy','/api/v1/leads/capture','/api/v1/resources/site-triage.pdf'}; assert required.issubset(paths), required-paths"
        env:
          ENV: production
          JWT_SECRET: ci-only-secret-with-more-than-enough-characters
          DATABASE_URL: sqlite:///./ci-property-augmented.db
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-augmented/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: property-augmented/web/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
