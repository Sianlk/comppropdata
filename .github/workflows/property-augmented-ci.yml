name: Property Augmented CI
on:
  push:
    branches: [property-augmented-platform]
    paths: ['property-augmented/**', '.github/workflows/property-augmented-ci.yml']
  pull_request:
    paths: ['property-augmented/**', '.github/workflows/property-augmented-ci.yml']
jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-augmented/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m py_compile app/main.py app/full_stack.py app/bootstrap.py app/extensions.py app/intelligence.py app/provider_privacy.py app/agents.py app/geo_intelligence.py app/hmlr_mapping.py app/market_intelligence.py app/development_strategy.py app/policy_feasibility.py app/commercial_calculators.py app/documents.py app/due_diligence.py app/operations.py app/readiness.py app/policy_security.py app/book.py app/site_signal.py app/production.py
      - run: python -c "from app.production import app; paths={r.path for r in app.routes}; required={'/health','/api/v1/system/status','/api/v1/system/readiness','/api/v1/auth/login','/api/v1/auth/forgot-password','/api/v1/projects','/api/v1/site/intelligence/full','/api/v1/site/dossier','/api/v1/geospatial/site-context','/api/v1/maps/os/{z}/{x}/{y}.png','/api/v1/maps/topography.png','/api/v1/maps/hmlr-inspire.png','/api/v1/intelligence/source-catalogue','/api/v1/intelligence/source-health','/api/v1/land/registration-guide','/api/v1/market/deal-scan','/api/v1/development/site-value','/api/v1/development/postcode-feasibility','/api/v1/development/concepts','/api/v1/development/fee-plan','/api/v1/development/application-pack','/api/v1/planning/prospects','/api/v1/planning/policy-pack','/api/v1/regulations/matrix','/api/v1/research/web-deep','/api/v1/policy/library','/api/v1/policy/search','/api/v1/agents','/api/v1/agents/{slug}/run','/api/v1/agents/committee','/api/v1/evidence/claims','/api/v1/evidence/health','/api/v1/documents/secure-upload','/api/v1/documents/{document_id}/analyse','/api/v1/calculators/scenario-lab','/api/v1/calculators/appraisal','/api/v1/calculators/residual-land-value','/api/v1/calculators/finance','/api/v1/calculators/manual-build-cost','/api/v1/calculators/max-land-bid','/api/v1/calculators/profit-target','/api/v1/calculators/cil-estimate','/api/v1/calculators/planning-fee-england','/api/v1/audit/events','/api/v1/projects/{project_id}/decision-pack.pdf','/api/v1/seo/strategy','/api/v1/leads/capture','/api/v1/resources/site-triage.pdf','/api/v1/resources/site-signal.pdf','/api/v1/leads/site-signal','/api/v1/resources/property-development-augmented-book.pdf','/api/v1/resources/book'}; assert required.issubset(paths), required-paths"
      - run: PYTHONPATH=. pytest --confcutdir=tests -q tests
      - name: Validate clean schema migration
        run: DATABASE_URL=sqlite:///./ci-migrated.db alembic upgrade head && DATABASE_URL=sqlite:///./ci-migrated.db alembic current
      - name: Build production API container
        run: docker build -f Dockerfile -t property-augmented-api-ci ..
      - name: Verify published manuscript packaged in container
        run: docker run --rm property-augmented-api-ci python -c "from pathlib import Path; required=['book.json','book-expansion.json','book-expansion-final.json','book-fieldwork.json']; assert all((Path('/content')/x).exists() for x in required), required"
      - name: Boot migrated production container
        run: |
          docker run -d --name pda-api-ci -p 18080:8080 -e ENV=production -e JWT_SECRET=ci-only-secret-with-more-than-enough-characters -e DATABASE_URL=sqlite:////tmp/pda-container.db property-augmented-api-ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health
          docker exec pda-api-ci python -c "import sqlite3; c=sqlite3.connect('/tmp/pda-container.db'); assert c.execute('select version_num from alembic_version').fetchone()[0]=='0001_initial_schema'"
          docker rm -f pda-api-ci
      - name: Python dependency audit
        run: pip-audit -r requirements.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
    env:
      ENV: production
      JWT_SECRET: ci-only-secret-with-more-than-enough-characters
      DATABASE_URL: sqlite:///./ci-property-augmented.db
      STORAGE_DIR: ./ci-storage
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-augmented/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: property-augmented/web/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_API_BASE_URL: https://api.example.com
          PDA_API_ORIGIN: https://api.example.com
          LEGAL_OPERATOR_NAME: Example Operator Ltd
          LEGAL_OPERATOR_ADDRESS: 1 Example Street, London, UK
          PRIVACY_CONTACT_EMAIL: privacy@example.com
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
